<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salon Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f6f4f8;
      --surface: #ffffff;
      --surface-2: #fbf9fd;
      --text: #1b1722;
      --muted: #6c6578;
      --border: #e6e0ee;
      --accent: #7c3aed;
      --accent-2: #6d28d9;
      --accent-soft: #f3ecff;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --warn: #b45309;
      --warn-bg: #fef3c7;
      --err: #b91c1c;
      --err-bg: #fee2e2;
      --radius: 14px;
      --shadow: 0 6px 24px rgba(27, 23, 34, 0.06);
    }

    body.dark {
      --bg: #110f17;
      --surface: #1a1724;
      --surface-2: #221e30;
      --text: #f3effa;
      --muted: #a69eb8;
      --border: #2e2940;
      --accent: #8b5cf6;
      --accent-2: #7c3aed;
      --accent-soft: #271f3d;
      --ok: #4ade80;
      --ok-bg: rgba(74, 222, 128, 0.14);
      --warn: #fbbf24;
      --warn-bg: rgba(251, 191, 36, 0.14);
      --err: #f87171;
      --err-bg: rgba(248, 113, 113, 0.14);
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      font-size: 13.5px;
    }

    .hidden { display: none !important; }

    /* Auth Overlay */
    #loginOverlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .auth-title { font-size: 18px; font-weight: 700; }
    .auth-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .tabs-row {
      display: flex;
      gap: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 7px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea { min-height: 76px; resize: vertical; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 10px;
      padding: 9px 14px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-2); }
    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); }
    .btn-danger {
      background: var(--err-bg);
      color: var(--err);
      border-color: transparent;
    }
    .btn-sm { padding: 6px 10px; font-size: 11.5px; border-radius: 8px; }
    .w-full { width: 100%; }

    .msg {
      margin-top: 10px;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 8px;
    }
    .msg.err { background: var(--err-bg); color: var(--err); }
    .msg.ok { background: var(--ok-bg); color: var(--ok); }

    /* App Layout */
    .app {
      display: grid;
      grid-template-columns: 245px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .side-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .nav-group { margin-bottom: 14px; }
    .nav-label {
      font-size: 10
